name: Publish VASPBERRY 1.6.3

on:
  # Adding or explicitly updating this workflow is the automatic release intent.
  # Ordinary VERSION, documentation and CI changes must not restart old publishers.
  push:
    branches: [master]
    paths: ['.github/workflows/publish-v1.6.3.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vaspberry-v1.6.3
  # Serialize duplicate requests without cancelling a POST or its final receipt.
  # The source/master guards reject an obsolete queued candidate.
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Infant83/VASPBERRY' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact-source CI, Bi, Intel MPI and archive installation, then publish once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_v163.py
      - name: Retain publication validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.6.3-publication-validation
          path: release-validation.json
          if-no-files-found: warn
