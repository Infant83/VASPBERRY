name: Publish VASPBERRY 1.4.1

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-v1.4.1.yml'
      - '.github/scripts/publish_v141.py'
      - 'docs/releases/v1.4.1.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vaspberry-v1.4.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Infant83/VASPBERRY' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact-source CI, Bi and Intel MPI calculations, then publish once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_v141.py
      - name: Retain publication validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.4.1-publication-validation
          path: release-validation.json
          if-no-files-found: warn
