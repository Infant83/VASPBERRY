name: Publish VASPBERRY 1.6.1

on:
  # Publication is complete; keep manual access and all immutable-tag guards.
  # Later validation changes must not restart this version-specific publisher.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vaspberry-v1.6.1
  # Superseded candidates must not block the current exact-source validation.
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'Infant83/VASPBERRY' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact-source CI, Bi, Intel MPI and archive installation, then publish once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_v161.py
      - name: Retain publication validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.6.1-publication-validation
          path: release-validation.json
          if-no-files-found: warn
