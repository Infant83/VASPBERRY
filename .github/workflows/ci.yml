name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-transport.txt
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-transport.txt
      - name: Run unit and regression tests
        env:
          MPLBACKEND: Agg
          PYTHONPATH: tools
        run: python -m unittest discover -s tests -v

  fortran-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran, BLAS, LAPACK, and Open MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libblas-dev liblapack-dev openmpi-bin libopenmpi-dev
      - name: Compile serial source
        run: >-
          gfortran -cpp -O2 -fcheck=all -ffixed-line-length-none
          -fallow-argument-mismatch
          -o vaspberry_gfortran_serial vaspberry_gfortran_serial.f
          -llapack -lblas
      - name: Verify serial help and version
        run: |
          ./vaspberry_gfortran_serial -h > vaspberry-help.txt
          grep -F "Ver 1.1.1" vaspberry-help.txt
      - name: Compile MPI source
        run: >-
          mpifort -cpp -DMPI_USE -O2 -ffixed-line-length-none
          -fallow-argument-mismatch
          -o vaspberry_mpi vaspberry.f
          -llapack -lblas
      - name: Run actual-source Fortran Z2 helper tests
        run: |
          mkdir -p build/z2-test
          gfortran -cpp -O0 -g -fcheck=all -fbacktrace \
            -ffpe-trap=invalid,zero,overflow \
            -ffixed-line-length-none -fallow-argument-mismatch \
            -c vaspberry_gfortran_serial.f \
            -o build/z2-test/vaspberry_serial.o
          objcopy --redefine-sym \
            main=vaspberry_serial_embedded_main \
            build/z2-test/vaspberry_serial.o
          gfortran -O0 -g -fcheck=all -fbacktrace \
            tests/fortran/test_z2_helpers.f90 \
            build/z2-test/vaspberry_serial.o \
            -llapack -lblas -o build/z2-test/test_z2_serial
          build/z2-test/test_z2_serial

          mpifort -cpp -DMPI_USE -O0 -g -fcheck=all -fbacktrace \
            -ffpe-trap=invalid,zero,overflow \
            -ffixed-line-length-none -fallow-argument-mismatch \
            -c vaspberry.f -o build/z2-test/vaspberry_mpi.o
          objcopy --redefine-sym \
            main=vaspberry_mpi_embedded_main \
            build/z2-test/vaspberry_mpi.o
          mpifort -O0 -g -fcheck=all -fbacktrace \
            tests/fortran/test_z2_helpers.f90 \
            build/z2-test/vaspberry_mpi.o \
            -llapack -lblas -o build/z2-test/test_z2_mpi
          build/z2-test/test_z2_mpi
