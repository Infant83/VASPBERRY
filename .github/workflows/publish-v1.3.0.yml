name: Publish VASPBERRY 1.3.0

# One version only. Validate the exact target before creating its immutable tag.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-v1.3.0.yml'
      - '.github/scripts/publish_v130.py'
      - 'docs/releases/v1.3.0.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vaspberry-v1.3.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Infant83/VASPBERRY' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify unchanged scientific source, wait for target CI and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_v130.py
      - name: Retain publication validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.3.0-publication-validation
          path: release-validation.json
          if-no-files-found: warn
