name: Withdraw duplicate VASPBERRY 1.6.0

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/withdraw-v1.6.0.yml'
      - '.github/scripts/withdraw_v160.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: withdraw-duplicate-vaspberry-v1.6.0
  cancel-in-progress: false

jobs:
  withdraw:
    if: github.repository == 'Infant83/VASPBERRY' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact-target withdrawal guards
        run: python3 -m unittest discover -s tests -p test_release_withdrawal.py -v
      - name: Withdraw duplicate release and tag; retain 1.5.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/withdraw_v160.py
      - name: Retain before and after metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.6.0-withdrawal-record
          path: withdrawal-validation.json
          if-no-files-found: warn
