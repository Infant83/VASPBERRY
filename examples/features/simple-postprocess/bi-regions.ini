# Public Bi example: select two saved k-point indices and reuse the pair cache.
# Reusing the pair cache skips VASPBERRY execution; only the Hall table is recalculated.
# First complete bi.ini, then from the repository root:
# python3 tools/vaspberry_post.py run examples/features/simple-postprocess/bi-regions.ini --reuse results/simple-bi
# python3 tools/vaspberry_post.py plot results/simple-bi-regions
# All paths are relative to this INI file. The original WAVECAR must remain available.

[run]
wavecar = ../../../results/simple-bi-input/WAVECAR
binary = ../../../build/vaspberry-ifx-mpi
output = ../../../results/simple-bi-regions
mesh = 12 12
spin_mode = soc
energy_reference = unchanged VASP eigenvalue zero
mpi_procs = 4
mpi_launcher = mpiexec.hydra

[hall]
mu = -1.3 -0.9 9
reference = -1.1
temperatures = 0

# The label is yours to choose; the actual selection is given by k_ids.
# These are the first two stored k points, not a named physical valley.
[region sampled_k]
k_ids = 1 2

[plot]
hall_regions = total sampled_k rest
