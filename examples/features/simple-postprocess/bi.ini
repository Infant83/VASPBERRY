# Public Bi bilayer: VASPBERRY pair export -> insulating charge-Hall scan.
# All paths are relative to this INI file, not to the shell's working directory.
# From repository root, fetch the public input once:
# python3 examples/fetch_inputs.py bi --output-dir results/simple-bi-input
# Load Intel oneAPI/Intel MPI/oneMKL and build VASPBERRY: make ifx-mpi
# The front end's run command executes VASPBERRY through MPI, then integrates Hall data.

[run]
wavecar = ../../../results/simple-bi-input/WAVECAR
binary = ../../../build/vaspberry-ifx-mpi
output = ../../../results/simple-bi
mesh = 12 12
spin_mode = soc
energy_reference = unchanged VASP eigenvalue zero
mpi_procs = 4
mpi_launcher = mpiexec.hydra

[hall]
# MIN MAX N: absolute VASP eigenvalue energies in eV, inclusive endpoints.
# These points are inside this input's sampled band-10/band-11 gap.
mu = -1.3 -0.9 9
reference = -1.1
# This insulating demonstration uses T=0 K; all 18 stored bands enter the sum.
temperatures = 0
