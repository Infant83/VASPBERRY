# Same public Bi WAVECAR; new scan reuses the validated pair cache.
# From repository root, after running bi.ini:
# python3 tools/vaspberry_post.py run examples/features/simple-postprocess/bi-rescan.ini --reuse results/simple-bi
# Paths are relative to this INI. Keep the previous result directory intact.

[run]
wavecar = ../../../results/simple-bi-input/WAVECAR
binary = ../../../build/vaspberry-ifx-mpi
output = ../../../results/simple-bi-rescan
mesh = 12 12
spin_mode = soc
energy_reference = unchanged VASP eigenvalue zero
mpi_procs = 4
mpi_launcher = mpiexec.hydra

[hall]
# Narrower, finer scan within the same sampled insulating gap.
mu = -1.25 -0.95 13
reference = -1.1
temperatures = 0
